name: Keep Render App Awake 24/7

on:
  schedule:
    # Runs every 10 minutes (pings external Render URL so it never spins down)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          APP_URL="${{ secrets.RENDER_APP_URL || 'https://careflow-vkhv.onrender.com' }}"
          echo "Pinging $APP_URL to keep server awake..."
          curl -s -f -m 30 "$APP_URL/index.php" || curl -s -m 30 "$APP_URL" || true
          echo "Ping successful! Server is awake."
